<!DOCTYPE html>
<html>
  <head>
    <title>Tutelar Tech Labs - Palo Alto Rule Export</title>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
      }

      .card {
        width: 500px;
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        transition: transform 0.3s ease;
        animation: fadeIn 0.8s ease-out;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      h2 {
        margin: 0;
        color: #2d3748;
        font-weight: 600;
        font-size: 28px;
        background: -webkit-linear-gradient(45deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        color: #718096;
        font-size: 15px;
        margin-top: 8px;
        letter-spacing: 0.5px;
      }

      label {
        font-weight: 600;
        color: #4a5568;
        display: block;
        margin-top: 20px;
        font-size: 14px;
        margin-bottom: 8px;
      }

      input,
      select {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 14px;
        background: #f8fafc;
        transition: all 0.3s ease;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }

      input:focus,
      select:focus {
        border-color: #667eea;
        outline: none;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        background: #fff;
      }

      .btn-primary {
        margin-top: 30px;
        width: 100%;
        padding: 15px;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(118, 75, 162, 0.6);
        background: linear-gradient(90deg, #5a67d8 0%, #6b46c1 100%);
      }

      .btn-primary:active {
        transform: translateY(1px);
      }

      #progress-container {
        display: none;
        margin-top: 25px;
        text-align: center;
      }
      
      #progress-container p {
        color: #718096;
        margin-bottom: 10px;
        font-size: 14px;
      }

      .progress-bar {
        width: 100%;
        height: 10px;
        background: #edf2f7;
        border-radius: 20px;
        overflow: hidden;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #667eea, #764ba2);
        border-radius: 20px;
        animation: progress 2s ease-in-out infinite;
      }

      @keyframes progress {
        0% { width: 0%; margin-left: 0; }
        50% { width: 60%; margin-left: 20%; }
        100% { width: 0%; margin-left: 100%; }
      }

      .footer {
        text-align: center;
        margin-top: 25px;
        font-size: 13px;
        color: #a0aec0;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="header">
        <h2>Firewall Export</h2>
        <p class="subtitle">Enterprise Export Tool</p>
      </div>

      <form method="POST" onsubmit="startExport()">
        <label>Firewall IP Address</label>
        <input name="host" placeholder="e.g. xxx.xxx.xx.x" required />

        <label>API Key</label>
        <input name="api_key" placeholder="Enter your API key..." required />

        <label>Duration</label>
        <select name="duration">
          <option value="1h">Last 1 hour</option>
          <option value="24h">Last 24 hours</option>
          <option value="7d">Last 7 days</option>
          <option value="1m">Last 1 month</option>
          <option value="all">All Logs</option>
          <option value="custom">Custom</option>
        </select>

        <label>Custom Duration</label>
        <input name="custom_duration" placeholder="e.g. 12h, 3d" />

        <label>Download Format</label>
        <select name="format">
          <option value="csv">CSV</option>
          <!-- <option value="json">JSON</option>
          <option value="both">CSV + JSON</option> -->
        </select>

        <button class="btn-primary" type="submit">Export Policies</button>
      </form>

      <div id="progress-container">
        <p>Fetching data from firewall...</p>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>

      <div class="footer">© Firewall Exports</div>
    </div>

    <script>
      function startExport() {
        document.getElementById("progress-container").style.display = "block";
      }
    </script>
  </body>
</html>
