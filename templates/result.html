<!DOCTYPE html>
<html>
  <head>
    <title>Export Result</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
      }

      .card {
        width: 560px;
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        animation: slideUp 0.6s ease-out;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      h2 {
        margin-top: 0;
        margin-bottom: 25px;
        color: #2d3748;
        font-weight: 600;
        font-size: 28px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .status {
        background: #f0f4ff;
        padding: 15px 20px;
        margin-bottom: 12px;
        border-left: 5px solid #667eea;
        border-radius: 8px;
        font-size: 15px;
        color: #4a5568;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        transition: transform 0.2s;
      }

      .status:hover {
        transform: translateX(5px);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        padding: 12px 24px;
        margin-right: 15px;
        margin-top: 25px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      .btn-download {
        background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        color: white;
      }

      .btn-download:hover {
        background: linear-gradient(135deg, #38a169 0%, #2f855a 100%);
        transform: translateY(-2px);
        box-shadow: 0 8px 15px rgba(72, 187, 120, 0.4);
      }

      .btn-back {
        background: #edf2f7;
        color: #4a5568;
      }

      .btn-back:hover {
        background: #e2e8f0;
        color: #2d3748;
        transform: translateY(-2px);
      }

      /* Toast */
      .toast {
        position: fixed;
        top: 30px;
        right: 30px;
        background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        color: white;
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 500;
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>

  <body onload="showToast()">
    <div class="card">
      <h2>📦 Export Completed</h2>

      {% for line in status %}
      <div class="status">{{ line }}</div>
      {% endfor %} {% if files.csv %}
      <a class="btn btn-download" href="/download/{{ files.csv }}">
        ⬇ Download CSV
      </a>
      {% endif %} {% if files.json %}
      <a class="btn btn-download" href="/download/{{ files.json }}">
        ⬇ Download JSON
      </a>
      {% endif %}

      <br /><br />
      <a class="btn btn-back" href="/">← Back to Export</a>
    </div>

    <div id="toast" class="toast">✅ Export completed successfully</div>

    <script>
      function showToast() {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => {
          toast.classList.remove("show");
        }, 3000);
      }
    </script>
  </body>
</html>
